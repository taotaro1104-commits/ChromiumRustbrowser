[workspace]
resolver = "2"
members = [
    "crates/ffi-traits",
    "crates/browser-core",
    "crates/storage",
    "crates/omnibox",
    "crates/policy",
    "crates/net-policy",
    "crates/shell-core",
    "crates/chromium-ffi",
    "bench/memory",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
publish = false

[workspace.dependencies]
thiserror = "2"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
proptest = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
