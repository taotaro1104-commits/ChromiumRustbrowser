[package]
name = "browser"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
publish = false

# bootstrap.exe(サンドボックス付き)が `rustbrowser.dll` の `RunWinMain` を呼ぶ構成。
[lib]
name = "rustbrowser"
crate-type = ["cdylib"]

# CEF のビルドが必要なため、ルートのワークスペース(verify 対象)には含めない。
[workspace]

[dependencies]
cef = "156.2.0"
shell-core = { path = "../../crates/shell-core" }
browser-core = { path = "../../crates/browser-core" }
storage = { path = "../../crates/storage" }
policy = { path = "../../crates/policy" }
net-policy = { path = "../../crates/net-policy" }
url = "2"
zeroize = "1"
keyring = { version = "3", default-features = false, features = ["windows-native"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ffi-traits = { path = "../../crates/ffi-traits" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
